<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Viko Blog - Insights on Reddit Marketing, AI SEO, and Community Growth">
    <title>Viko Blog</title>
    <link rel="icon" href="favicon-96x96.png" type="image/png" sizes="96x96">
    <link rel="icon" href="favicon-48x48.png" type="image/png" sizes="48x48">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#f6f4ef">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="nav.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon">V</div>
                <div class="logo-text">
                    <h1>Viko</h1>
                    <div class="tagline">
                        <i class="fab fa-reddit-alien"></i>
                        <span>agency</span>
                    </div>
                </div>
            </a>
            <nav class="primary-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="index.html#capabilities">Services</a>
                <a href="case-study.html">Case studies</a>
                <a href="blog.html">Insights</a>
            </nav>
            <div class="header-actions">
                <a href="https://wa.me/254726979973?text=Hi%20Viko%2C%20I%20want%20to%20grow%20on%20Reddit"
                    class="btn btn-wa" role="button" aria-label="Contact via WhatsApp"><i class="fab fa-whatsapp"></i>
                    Whatsapp</a>
                <button class="btn btn-primary"
                    onclick="window.location.href='index.html#booking'">Book call</button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Viko Blog</h1>
                <p>Insights on Reddit marketing, AI SEO, and community growth strategies.</p>
            </div>
        </section>

        <section class="container">
            <div class="catalog-list" id="insights-grid"></div>
            <p class="catalog-cta">Want these strategies working for your brand? <a class="btn btn-primary" href="index.html#booking"><i class="far fa-calendar-check"></i> Book a strategy call</a></p>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Viko Marketing Agency. All rights reserved.</p>
        </div>
    </footer>

    <!-- Articles come from insights.js — that file is where you add, edit, or delete articles. -->
    <script src="insights.js"></script>
    <script>
        document.getElementById('insights-grid').innerHTML = INSIGHTS.map(post => `
            <a class="service-tile" href="blog-post.html?id=${post.id}">
                <i class="${post.badgeIcon} service-icon"></i>
                <h3>${post.title} <span class="catalog-line">${post.date} · ${post.readTime} · ${post.badge}</span></h3>
                <div class="service-thumb-container"><div class="blog-image"><i class="${post.icon}"></i></div></div>
            </a>
        `).join('');
    </script>
</body>

</html>
