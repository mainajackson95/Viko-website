    <script>
        const services = {
            reddit: {
                title: 'Reddit growth',
                lead: 'Launch sustained Reddit authority with high-karma account strategies, community-first posting, and measurable engagement.',
                heading: 'Reddit growth that earns attention and trust',
                description: 'We scale your visibility the right way: by creating posts and comments that deliver real value, gain karma, and build credibility inside relevant subreddits.',
                meta: ['10k+ karma accounts', 'Organic community growth', 'Real post performance'],
                items: [
                    'Targeted subreddit research and content mapping',
                    'High-value engagement from trusted accounts',
                    'Monthly reporting with community performance metrics',
                ],
                image: 'case-study-1.png'
            },
            'ai-seo': {
                title: 'AI & LLM SEO',
                lead: 'Build Reddit content that works for people and AI search engines alike, increasing discoverability across ChatGPT, Google, and LLM platforms.',
                heading: 'AI-optimized Reddit content for next-gen search',
                description: 'We structure posts and comments so AI systems can understand your brand narrative, making your content more likely to be surfaced in LLM answers and search snippets.',
                meta: ['LLM-ready content', 'AI search visibility', 'Structured engagement'],
                items: [
                    'Content designed for AI indexing',
                    'Keyword and intent alignment for Reddit',
                    'Optimization for both community and search',
                ],
                image: 'case-study-7-section-1.jpg'
            },
            analytics: {
                title: 'Analytics & insights',
                lead: 'Measure what matters with campaign tracking, sentiment analysis, and performance insights that keep your Reddit strategy data-driven.',
                heading: 'Analytics that turn Reddit activity into real business intelligence',
                description: 'We track engagement, sentiment, and conversion signals so you can make smarter decisions and improve community returns over time.',
                meta: ['Sentiment tracking', 'Trend forecasting', 'ROI reporting'],
                items: [
                    'Weekly performance dashboards',
                    'Engagement and conversion analysis',
                    'Strategy adjustments based on real data',
                ],
                image: 'case-study-8-section-1.jpg'
            },
            reputation: {
                title: 'Reputation management',
                lead: 'Protect your brand on Reddit with fast response plans, reputation repair, and community trust-building measures.',
                heading: 'Reputation management for the Reddit era',
                description: 'We handle difficult conversations thoughtfully, reduce negative visibility, and restore trust with transparent, community-friendly outreach.',
                meta: ['Crisis response', 'Brand recovery', 'Trust building'],
                items: [
                    'Reputation audit and risk assessment',
                    'Response scripting and community support',
                    'Monitoring for emerging issues',
                ],
                image: 'case-study-4-section-1.png'
            },
            content: {
                title: 'Content strategy',
                lead: 'Create Reddit-first content that resonates with communities and builds a consistent pipeline of engagement.',
                heading: 'Content strategy that converts Reddit activity into qualified leads',
                description: 'Our content plans are designed to keep your brand visible, helpful, and aligned with the natural flow of each subreddit.',
                meta: ['Community-first content', 'Lead-focused stories', 'Long-term visibility'],
                items: [
                    'Content calendars for Reddit communities',
                    'Message frameworks for subtle brand positioning',
                    'Ongoing content performance reviews',
                ],
                image: 'case-study-3-section-2.png'
            }
        };

        const params = new URLSearchParams(window.location.search);
        const topic = params.get('topic');
        const service = services[topic] || services.reddit;
        const imageSizes = {
            'case-study-1.png': [936, 408],
            'case-study-3-section-2.png': [714, 1122],
            'case-study-4-section-1.png': [554, 1350],
        };

        function escapeAttribute(value) {
            return value.replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            })[char]);
        }

        function optimizedImage(src, alt) {
            const [width, height] = imageSizes[src] || [];
            const dimensions = width && height ? ` width="${width}" height="${height}"` : '';
            const avifSrc = src.replace(/\.png$/, '.avif');

            return `<picture>
                <source srcset="${avifSrc}" type="image/avif">
                <img src="${src}"${dimensions} alt="${escapeAttribute(alt)}" loading="lazy" decoding="async">
            </picture>`;
        }

        document.getElementById('service-title').textContent = service.title;
        document.getElementById('service-lead').textContent = service.lead;
        document.getElementById('service-heading').textContent = service.heading;
        document.getElementById('service-description').textContent = service.description;
        document.getElementById('service-meta').innerHTML = service.meta.map(item => `<span>${item}</span>`).join('');
        document.getElementById('service-list').innerHTML = service.items.map(item => `<li>${item}</li>`).join('');
        document.getElementById('service-image').innerHTML = optimizedImage(service.image, service.title);
    </script>
</body>
